<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goose Usage Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1121;
      --surface: #0f172a;
      --card: #151e32;
      --card-hover: #1e293b;
      --border: #1e293b;
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }

    .subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .last-updated {
      font-size: 12px;
      color: var(--text-secondary);
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .btn:hover { background: var(--card-hover); }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: #2563eb; }
    .btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .dashboard {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      align-content: start;
    }

    .dashboard::-webkit-scrollbar { width: 8px; }
    .dashboard::-webkit-scrollbar-track { background: transparent; }
    .dashboard::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg { width: 16px; height: 16px; opacity: 0.8; }

    .card-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      font-weight: 500;
    }

    /* KPI */
    .kpi-section {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .kpi-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .kpi-icon.green { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .kpi-icon.amber { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .kpi-icon.red { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .kpi-icon.purple { background: rgba(139, 92, 246, 0.15); color: var(--purple); }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .kpi-delta {
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kpi-delta.up { color: var(--success); }
    .kpi-delta.down { color: var(--danger); }

    /* Charts */
    .chart-section { grid-column: span 4; display: flex; flex-direction: column; min-height: 260px; }
    .chart-section.wide { grid-column: span 8; }
    .chart-section.full { grid-column: span 12; }

    .chart-body { flex: 1; position: relative; min-height: 0; }
    .chart-body svg { width: 100%; height: 100%; overflow: visible; }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Anomalies & Recommendations */
    .anomaly-section { grid-column: span 6; }
    .recommendation-section { grid-column: span 6; }

    .anomaly-list, .recommendation-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .anomaly-item, .recommendation-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .severity {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .severity.high { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .severity.medium { background: var(--warning); }
    .severity.low { background: var(--success); }

    .anomaly-text, .recommendation-text { font-size: 13px; line-height: 1.5; }
    .anomaly-meta, .recommendation-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Token Flow */
    .token-flow-section { grid-column: 1 / -1; }
    .flow-container { width: 100%; height: 140px; }
    .flow-label {
      font-size: 11px;
      fill: var(--text-secondary);
      text-anchor: middle;
    }
    .flow-value {
      font-size: 14px;
      font-weight: 600;
      fill: var(--text);
      text-anchor: middle;
    }

    /* Table */
    .table-section { grid-column: 1 / -1; }

    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead { background: var(--surface); }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr:hover { background: var(--surface); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .status.success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
    .status.success::before { background: var(--success); }
    .status.warning { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
    .status.warning::before { background: var(--warning); }
    .status.error { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
    .status.error::before { background: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }

    @media (max-width: 1200px) {
      .kpi-section { grid-template-columns: repeat(3, 1fr); }
      .chart-section, .chart-section.wide { grid-column: span 6; }
      .anomaly-section, .recommendation-section { grid-column: span 12; }
    }

    @media (max-width: 768px) {
      .kpi-section { grid-template-columns: repeat(2, 1fr); }
      .chart-section, .chart-section.wide,
      .anomaly-section, .recommendation-section { grid-column: span 12; }
    }
  </style>

    // ======================= Data Loading =======================
    async function loadData() {
      try {
        const response = await fetch('data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.warn('[Goose Dashboard] Failed to load data.json, using mock data:', error.message);
        return generateMockData();
      }
    }

    // ======================= Chart Renderers =======================
    function createSvg(viewBox) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', viewBox);
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      return svg;
    }

    function gridLines(svg, count, color = '#1e293b') {
      const step = 200 / (count + 1);
      for (let i = 1; i <= count; i++) {
        const y = step * i;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '0');
        line.setAttribute('x2', '400');
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '1');
        line.setAttribute('stroke-dasharray', '4 4');
        svg.appendChild(line);
      }
    }

    function renderLineChart(container, data) {
      const svg = createSvg('0 0 400 220');
      gridLines(svg, 4);
      const values = data.datasets[0].data;
      const labels = data.labels;
      const max = Math.max(...values) * 1.1;
      const min = Math.min(...values) * 0.9;
      const range = max - min || 1;
      const stepX = 400 / (values.length - 1 || 1);

      const points = values.map((v, i) => {
        const x = i * stepX;
        const y = 210 - ((v - min) / range) * 180;
        return `${x},${y}`;
      }).join(' ');

      const color = data.datasets[0].color || COLORS.primary;

      // Area fill
      const areaPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      areaPath.setAttribute('d', `M0,210 ${points.split(' ').map(p => 'L' + p).join(' ')} L400,210 Z`);
      areaPath.setAttribute('fill', color);
      areaPath.setAttribute('opacity', '0.15');
      svg.appendChild(areaPath);

      // Line
      const linePath = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      linePath.setAttribute('points', points);
      linePath.setAttribute('fill', 'none');
      linePath.setAttribute('stroke', color);
      linePath.setAttribute('stroke-width', '3');
      linePath.setAttribute('stroke-linecap', 'round');
      linePath.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(linePath);

      // Points
      values.forEach((v, i) => {
        const x = i * stepX;
        const y = 210 - ((v - min) / range) * 180;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', '3');
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#0f172a');
        circle.setAttribute('stroke-width', '2');
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${labels[i] || ''}: ${formatNumber(v)}`;
        circle.appendChild(title);
        svg.appendChild(circle);
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function renderAreaChart(container, data) {
      const svg = createSvg('0 0 400 220');
      gridLines(svg, 4);
      const values = data.datasets[0].data;
      const labels = data.labels;
      const max = Math.max(...values) * 1.1;
      const min = Math.min(...values) * 0.9;
      const range = max - min || 1;
      const stepX = 400 / (values.length - 1 || 1);
      const color = data.datasets[0].color || COLORS.success;

      const points = values.map((v, i) => {
        const x = i * stepX;
        const y = 210 - ((v - min) / range) * 180;
        return `${x},${y}`;
      }).join(' ');

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      grad.setAttribute('id', 'areaGrad');
      grad.setAttribute('x1', '0');
      grad.setAttribute('y1', '0');
      grad.setAttribute('x2', '0');
      grad.setAttribute('y2', '1');
      grad.innerHTML = `<stop offset="0%" stop-color="${color}" stop-opacity="0.5"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>`;
      defs.appendChild(grad);
      svg.appendChild(defs);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M0,210 ${points.split(' ').map(p => 'L' + p).join(' ')} L400,210 Z`);
      path.setAttribute('fill', 'url(#areaGrad)');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '2');
      svg.appendChild(path);

      values.forEach((v, i) => {
        const x = i * stepX;
        const y = 210 - ((v - min) / range) * 180;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', '3');
        circle.setAttribute('fill', color);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${labels[i] || ''}: $${v.toFixed(4)}`;
        circle.appendChild(title);
        svg.appendChild(circle);
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function renderBarChart(container, data) {
      const svg = createSvg('0 0 400 220');
      gridLines(svg, 4);
      const values = data.datasets[0].data;
      const labels = data.labels;
      const colors = Array.isArray(data.datasets[0].color) ? data.datasets[0].color : [data.datasets[0].color || COLORS.primary];
      const max = Math.max(...values) * 1.1 || 1;
      const barWidth = 320 / values.length;
      const startX = 40;

      values.forEach((v, i) => {
        const h = (v / max) * 180;
        const x = startX + i * barWidth + barWidth * 0.15;
        const y = 210 - h;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', barWidth * 0.7);
        rect.setAttribute('height', h);
        rect.setAttribute('rx', '4');
        rect.setAttribute('fill', colors[i % colors.length]);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${labels[i] || ''}: ${formatNumber(v)}`;
        rect.appendChild(title);
        svg.appendChild(rect);
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function renderDoughnutChart(container, data) {
      const svg = createSvg('0 0 220 220');
      const values = data.datasets[0].data;
      const labels = data.labels;
      const colors = Array.isArray(data.datasets[0].color) ? data.datasets[0].color : [data.datasets[0].color || COLORS.primary];
      const total = values.reduce((a, b) => a + b, 0) || 1;
      const radius = 90;
      const cx = 110;
      const cy = 110;
      let startAngle = -Math.PI / 2;

      values.forEach((v, i) => {
        const angle = (v / total) * Math.PI * 2;
        const endAngle = startAngle + angle;
        const x1 = cx + radius * Math.cos(startAngle);
        const y1 = cy + radius * Math.sin(startAngle);
        const x2 = cx + radius * Math.cos(endAngle);
        const y2 = cy + radius * Math.sin(endAngle);
        const largeArc = angle > Math.PI ? 1 : 0;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`);
        path.setAttribute('fill', colors[i % colors.length]);
        path.setAttribute('stroke', '#151e32');
        path.setAttribute('stroke-width', '3');
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${labels[i] || ''}: ${((v / total) * 100).toFixed(1)}%`;
        path.appendChild(title);
        svg.appendChild(path);

        // Inner circle for doughnut
        const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        inner.setAttribute('cx', cx);
        inner.setAttribute('cy', cy);
        inner.setAttribute('r', '55');
        inner.setAttribute('fill', '#151e32');
        svg.appendChild(inner);

        const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        centerText.setAttribute('x', cx);
        centerText.setAttribute('y', cy - 5);
        centerText.setAttribute('text-anchor', 'middle');
        centerText.setAttribute('fill', 'var(--text)');
        centerText.setAttribute('font-size', '14');
        centerText.setAttribute('font-weight', '600');
        centerText.textContent = formatNumber(total);
        svg.appendChild(centerText);

        const centerLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        centerLabel.setAttribute('x', cx);
        centerLabel.setAttribute('y', cy + 14);
        centerLabel.setAttribute('text-anchor', 'middle');
        centerLabel.setAttribute('fill', 'var(--text-secondary)');
        centerLabel.setAttribute('font-size', '10');
        centerLabel.textContent = 'Total';
        svg.appendChild(centerLabel);

        startAngle = endAngle;
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function renderRadarChart(container, data) {
      const svg = createSvg('0 0 260 220');
      const values = data.datasets[0].data;
      const labels = data.labels;
      const color = data.datasets[0].color || COLORS.purple;
      const cx = 130;
      const cy = 110;
      const radius = 80;
      const count = values.length;
      const max = Math.max(...values) || 1;

      // Web
      for (let r = 1; r <= 4; r++) {
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        const pts = [];
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
          pts.push(`${cx + radius * (r / 4) * Math.cos(angle)},${cy + radius * (r / 4) * Math.sin(angle)}`);
        }
        polygon.setAttribute('points', pts.join(' '));
        polygon.setAttribute('fill', 'none');
        polygon.setAttribute('stroke', '#1e293b');
        polygon.setAttribute('stroke-width', '1');
        svg.appendChild(polygon);
      }

      // Axes & labels
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
        const x2 = cx + radius * Math.cos(angle);
        const y2 = cy + radius * Math.sin(angle);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx);
        line.setAttribute('y1', cy);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#1e293b');
        svg.appendChild(line);

        const labelX = cx + (radius + 18) * Math.cos(angle);
        const labelY = cy + (radius + 18) * Math.sin(angle);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', labelX);
        text.setAttribute('y', labelY + 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', 'var(--text-secondary)');
        text.setAttribute('font-size', '10');
        text.textContent = labels[i];
        svg.appendChild(text);
      }

      // Data polygon
      const pts = [];
      values.forEach((v, i) => {
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
        const d = (v / max) * radius;
        pts.push(`${cx + d * Math.cos(angle)},${cy + d * Math.sin(angle)}`);
      });
      const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      polygon.setAttribute('points', pts.join(' '));
      polygon.setAttribute('fill', color);
      polygon.setAttribute('fill-opacity', '0.3');
      polygon.setAttribute('stroke', color);
      polygon.setAttribute('stroke-width', '2');
      svg.appendChild(polygon);

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function renderHorizontalBarChart(container, data) {
      const svg = createSvg('0 0 400 220');
      gridLines(svg, 4);
      const values = data.datasets[0].data;
      const labels = data.labels;
      const color = data.datasets[0].color || COLORS.warning;
      const max = Math.max(...values) * 1.1 || 1;
      const barHeight = 180 / values.length;

      values.forEach((v, i) => {
        const y = 20 + i * barHeight;
        const w = (v / max) * 300;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', '80');
        rect.setAttribute('y', y);
        rect.setAttribute('width', w);
        rect.setAttribute('height', barHeight * 0.65);
        rect.setAttribute('rx', '4');
        rect.setAttribute('fill', color);
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${labels[i] || ''}: ${formatNumber(v)} tokens`;
        rect.appendChild(title);
        svg.appendChild(rect);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', '75');
        label.setAttribute('y', y + barHeight * 0.45);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('fill', 'var(--text-secondary)');
        label.setAttribute('font-size', '10');
        label.textContent = labels[i].split(' ').pop();
        svg.appendChild(label);
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    // ======================= Components =======================
    function icon(name) {
      const icons = {
        tokens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
        cost: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
        requests: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
        sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        latency: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        models: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
        cache: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
        anomaly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
        lightbulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17h8v-2.26C17.81 13.47 19 11.38 19 9a7 7 0 0 0-7-7z"/></svg>',
        flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M2 12h20"/><path d="m7 7 5 5-5 5"/></svg>',
        table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v14"/><path d="M3 7h18"/><path d="M21 7v14"/><path d="M3 12h18"/><path d="M3 17h18"/></svg>'
      };
      return icons[name] || icons.chart;
    }

    function formatNumber(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toString();
    }

    function createKPICard(kpi, index) {
      const iconsMap = ['tokens', 'cost', 'requests', 'sessions', 'latency', 'error', 'users', 'models', 'cache', 'anomaly'];
      const deltaClass = kpi.up ? 'up' : 'down';
      const arrow = kpi.up ? '↑' : '↓';
      return `
        <div class="card kpi-card fade-in" style="animation-delay: ${index * 40}ms">
          <div class="kpi-header">
            <span>${kpi.label}</span>
            <div class="kpi-icon ${kpi.icon}">${icon(iconsMap[index] || 'chart')}</div>
          </div>
          <div class="kpi-value">${kpi.value}</div>
          <div class="kpi-delta ${deltaClass}">${arrow} ${kpi.delta}</div>
        </div>
      `;
    }

    function createChartCard(title, iconName, chartId, badge, wide = false) {
      return `
        <div class="card chart-section ${wide ? 'wide' : ''} fade-in">
          <div class="card-header">
            <div class="card-title">${icon(iconName)} ${title}</div>
            ${badge ? `<span class="card-badge">${badge}</span>` : ''}
          </div>
          <div class="chart-body" id="${chartId}"></div>
        </div>
      `;
    }

    function createAnomalySection(anomalies) {
      const items = anomalies.map(a => `
        <div class="anomaly-item">
          <div class="severity ${a.severity}"></div>
          <div>
            <div class="anomaly-text">${a.text}</div>
            <div class="anomaly-meta">${a.severity.toUpperCase()} • ${a.time}</div>
          </div>
        </div>
      `).join('');
      return `
        <div class="card anomaly-section fade-in">
          <div class="card-header">
            <div class="card-title">${icon('anomaly')} Anomaly Detection</div>
          </div>
          <div class="anomaly-list">${items}</div>
        </div>
      `;
    }

    function createRecommendationSection(recommendations) {
      const items = recommendations.map(r => `
        <div class="recommendation-item">
          <div style="color: var(--success); flex-shrink: 0; margin-top: 2px;">${icon('lightbulb')}</div>
          <div>
            <div class="recommendation-text">${r.text}</div>
            <div class="recommendation-meta">Impact: ${r.impact}</div>
          </div>
        </div>
      `).join('');
      return `
        <div class="card recommendation-section fade-in">
          <div class="card-header">
            <div class="card-title">${icon('lightbulb')} Recommendations</div>
          </div>
          <div class="recommendation-list">${items}</div>
        </div>
      `;
    }

    function renderTokenFlow(container, data) {
      const { input, cached, output, wasted } = data;
      const total = input + cached;
      const svg = createSvg('0 0 900 140');

      // Nodes
      const nodes = [
        { x: 100, y: 70, label: 'Input Tokens', value: input, color: COLORS.primary },
        { x: 320, y: 70, label: 'Processing', value: total, color: COLORS.purple },
        { x: 540, y: 35, label: 'Output Tokens', value: output, color: COLORS.success },
        { x: 540, y: 105, label: 'Cache Hits', value: cached, color: COLORS.cyan },
        { x: 780, y: 70, label: 'Wasted', value: wasted, color: COLORS.danger }
      ];

      // Connections (Bezier curves)
      const connections = [
        { from: nodes[0], to: nodes[1], color: COLORS.primary },
        { from: nodes[1], to: nodes[2], color: COLORS.success },
        { from: nodes[1], to: nodes[3], color: COLORS.cyan },
        { from: nodes[2], to: nodes[4], color: COLORS.danger }
      ];

      connections.forEach(c => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const cp1x = c.from.x + (c.to.x - c.from.x) * 0.5;
        const cp2x = c.from.x + (c.to.x - c.from.x) * 0.5;
        path.setAttribute('d', `M ${c.from.x + 50} ${c.from.y} C ${cp1x} ${c.from.y}, ${cp2x} ${c.to.y}, ${c.to.x - 50} ${c.to.y}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', c.color);
        path.setAttribute('stroke-width', '3');
        path.setAttribute('stroke-opacity', '0.5');
        svg.appendChild(path);
      });

      nodes.forEach(n => {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', n.x - 50);
        rect.setAttribute('y', n.y - 24);
        rect.setAttribute('width', '100');
        rect.setAttribute('height', '48');
        rect.setAttribute('rx', '8');
        rect.setAttribute('fill', '#0f172a');
        rect.setAttribute('stroke', n.color);
        rect.setAttribute('stroke-width', '2');
        svg.appendChild(rect);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', n.x);
        label.setAttribute('y', n.y - 6);
        label.setAttribute('class', 'flow-label');
        label.textContent = n.label;
        svg.appendChild(label);

        const val = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        val.setAttribute('x', n.x);
        val.setAttribute('y', n.y + 12);
        val.setAttribute('class', 'flow-value');
        val.textContent = formatNumber(n.value);
        svg.appendChild(val);
      });

      container.innerHTML = '';
      container.appendChild(svg);
    }

    function createTokenFlowSection(data) {
      return `
        <div class="card token-flow-section fade-in">
          <div class="card-header">
            <div class="card-title">${icon('flow')} Token Flow</div>
          </div>
          <div class="flow-container" id="tokenFlow"></div>
        </div>
      `;
    }

    function createSessionTable(sessions) {
      const rows = sessions.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.user}</td>
          <td>${s.model}</td>
          <td>${formatNumber(s.tokens)}</td>
          <td>${s.duration}</td>
          <td><span class="status ${s.status}">${s.status}</span></td>
          <td>${s.time}</td>
        </tr>
      `).join('');
      return `
        <div class="card table-section fade-in">
          <div class="card-header">
            <div class="card-title">${icon('table')} Recent Sessions</div>
            <span class="card-badge">${sessions.length} sessions</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Session ID</th>
                  <th>User</th>
                  <th>Model</th>
                  <th>Tokens</th>
                  <th>Duration</th>
                  <th>Status</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ======================= Main Render =======================
    async function renderDashboard() {
      const dashboard = document.getElementById('dashboard');
      dashboard.innerHTML = '<div class="empty-state">Loading dashboard data...</div>';

      const data = await loadData();

      let html = '';

      // KPIs
      html += '<div class="kpi-section">';
      html += (data.kpis || []).map((kpi, i) => createKPICard(kpi, i)).join('');
      html += '</div>';

      // Charts
      html += createChartCard('Token Usage Trend', 'chart', 'chart-tokenTrend', '24h', true);
      html += createChartCard('Requests by Model', 'chart', 'chart-modelUsage');
      html += createChartCard('Cost Analysis', 'cost', 'chart-costAnalysis', '$/hr', true);
      html += createChartCard('Status Distribution', 'chart', 'chart-statusDistribution');
      html += createChartCard('Capability Radar', 'chart', 'chart-capabilityRadar');
      html += createChartCard('Top Sessions', 'chart', 'chart-topSessions');
      html += createChartCard('Response Time', 'latency', 'chart-responseTime');

      // Anomalies, Recommendations, Token Flow, Table
      html += createAnomalySection(data.anomalies || []);
      html += createRecommendationSection(data.recommendations || []);
      html += createTokenFlowSection(data.tokenFlow);
      html += createSessionTable(data.sessions || []);

      dashboard.innerHTML = html;

      // Render charts after DOM insertion
      requestAnimationFrame(() => {
        if (data.charts?.tokenTrend) renderLineChart(document.getElementById('chart-tokenTrend'), data.charts.tokenTrend);
        if (data.charts?.modelUsage) renderBarChart(document.getElementById('chart-modelUsage'), data.charts.modelUsage);
        if (data.charts?.costAnalysis) renderAreaChart(document.getElementById('chart-costAnalysis'), data.charts.costAnalysis);
        if (data.charts?.statusDistribution) renderDoughnutChart(document.getElementById('chart-statusDistribution'), data.charts.statusDistribution);
        if (data.charts?.capabilityRadar) renderRadarChart(document.getElementById('chart-capabilityRadar'), data.charts.capabilityRadar);
        if (data.charts?.topSessions) renderHorizontalBarChart(document.getElementById('chart-topSessions'), data.charts.topSessions);
        if (data.charts?.responseTime) renderLineChart(document.getElementById('chart-responseTime'), data.charts.responseTime);
        if (data.tokenFlow) renderTokenFlow(document.getElementById('tokenFlow'), data.tokenFlow);
      });

      document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    }

    async function refreshData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      try {
        await renderDashboard();
      } catch (error) {
        console.error('Refresh failed:', error);
        alert('Failed to refresh dashboard data.');
      } finally {
        btn.classList.remove('spinning');
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', renderDashboard);

    // Auto-refresh every 60 seconds
    setInterval(refreshData, 60000);
  </script>
</body>
</html>
